apiVersion: apps/v1
kind: Deployment
metadata:
  name: dewi-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dewi
  template:
    metadata:
      labels:
        app: dewi
    spec:
      containers:
      - name: dewi-container
        image: archofficial97/dewiapp:v1.0.0
        ports:
        - containerPort: 8000
